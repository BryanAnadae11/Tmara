{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Account settings</title>

    <link rel="icon" href="{% static 'lionhead.png' %}" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.1/css/all.css" integrity="sha384-gfdkjb5BdAXd+lj+gudLWI+BXq4IuLW5IT+brZEZsLFm++aCMlF1V92rMkPaX4PP" crossorigin="anonymous">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <style>
        body { background: #f5f6fa; font-family: 'Nunito', sans-serif; }

        .kyc-app { max-width: 720px; margin: 40px auto; }

        .kyc-head { text-align: center; margin-bottom: 24px; }
        .kyc-head h2 { font-weight: 600; }

        .card-bordered { border: 1px solid #e5e9f2; border-radius: 8px; }

        .nk-kycfm-head {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 24px 24px 0 24px;
        }
        .nk-kycfm-count {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #024139;
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }
        .nk-kycfm-title h5 { margin: 0; font-weight: 600; }
        .nk-kycfm-title p { margin: 0; color: #8094ae; font-size: 13px; }

        .nk-kycfm-content { padding: 24px; }

        .profile {
            max-width: 140px;
            max-height: 140px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 16px auto;
            object-fit: cover;
        }

        .nk-kycfm-footer { padding: 0 24px 24px 24px; }

        .btn-success { background-color: #024139; border-color: #024139; }
        .btn-success:hover { background-color: #012e28; border-color: #012e28; }

        .back-links { display: flex; justify-content: space-between; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="kyc-app">

        <div class="back-links">
            <a href="{% url 'dashboard' %}" class="btn btn-outline-info btn-sm">&#8592; Back to dashboard</a>
            <a href="{% url 'home' %}" class="btn btn-outline-info btn-sm">&#8592; Back to home</a>
        </div>

        <div class="kyc-head">
            <h2>Account Settings</h2>
        </div>

        <div class="card card-bordered">
            <div class="nk-kycfm">
                <div class="nk-kycfm-head">
                    <div class="nk-kycfm-count">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="nk-kycfm-title">
                        <h5 class="title">Profile</h5>
                        <p class="sub-title">Your account details and profile picture</p>
                    </div>
                </div>

                <div class="nk-kycfm-content">
                    <img src="{{ request.user.client.profile_picUrl }}" class="profile" alt="Profile picture">

                    <form method="POST" action="" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <div class="nk-kycfm-footer px-0">
                            <button type="submit" class="btn btn-lg btn-success" name="Update information">Save changes</button>
                        </div>
                    </form>

                    <p style="color: red; margin-top: 12px;">To update your profile picture, clear the default profile picture.</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
